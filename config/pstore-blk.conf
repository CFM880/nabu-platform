# pstore/blk: keep kernel oops/panic logs on the spare "oops" partition.
#
# This SoC reinitialises DDR on every reset, so a ramoops buffer can never hold
# a log (measured on hardware).  The "oops" partition is 16 MiB, unused by any
# OS, and survives a power cycle.
#
# best_effort is the only mode that accepts a plain block device; the module is
# loaded by 99-nabu-pstore.rules as soon as the partition appears, because a
# built-in pstore_blk runs before the UFS scan and gives up.
options pstore_blk blkdev=/dev/sda16 best_effort=1 kmsg_size=1024 pmsg_size=0 console_size=0
